<!DOCTYPE html>
<html lang="id" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Live — Ryounime</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/nav.css">
  <link rel="stylesheet" href="/assets/css/player.css">
  <style>
    .live-page { padding-top: 0; padding-bottom: calc(var(--bottom-nav-h) + 16px); }

    /* Channel list */
    .channel-section { padding: 14px 0; }
    .channel-section-title {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      padding: 0 16px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse-dot 1.5s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .channel-list { display: flex; flex-direction: column; gap: 2px; }
    .channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background var(--transition);
      border-bottom: 1px solid var(--border);
    }
    .channel-item:active, .channel-item.active { background: var(--accent-dim); }
    .channel-logo {
      width: 48px; height: 48px;
      border-radius: var(--radius-sm);
      background: var(--bg-secondary);
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }
    .channel-info { flex: 1; min-width: 0; }
    .channel-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .channel-now { font-size: 12px; color: var(--text-muted); }
    .channel-live-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(239,68,68,0.15);
      color: #ef4444;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 3px 7px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* Category tabs */
    .cat-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 16px;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      transition: all var(--transition);
    }
    .cat-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>

<div class="live-page">
  <!-- VIDEO PLAYER (hidden until channel selected) -->
  <div class="video-wrap" id="video-wrap" style="display:none">
    <video id="ryou-live-video" playsinline></video>
  </div>

  <!-- SELECTED CHANNEL INFO -->
  <div id="now-playing" style="display:none;padding:10px 16px;background:var(--bg-card);border-bottom:1px solid var(--border)">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="live-dot"></div>
      <span style="font-size:13px;font-weight:700" id="now-channel-name">—</span>
      <span style="font-size:12px;color:var(--text-muted)" id="now-program">—</span>
    </div>
  </div>

  <!-- HEADER (non-sticky, inside page) -->
  <div style="padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between">
    <span style="font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-0.02em">Live TV</span>
    <div class="live-dot"></div>
  </div>

  <!-- CATEGORY TABS -->
  <div class="cat-tabs" id="cat-tabs">
    <button class="cat-tab active" data-cat="">Semua</button>
    <button class="cat-tab" data-cat="news">Berita</button>
    <button class="cat-tab" data-cat="entertainment">Hiburan</button>
    <button class="cat-tab" data-cat="kids">Anak</button>
    <button class="cat-tab" data-cat="sports">Olahraga</button>
    <button class="cat-tab" data-cat="anime">Anime</button>
    <button class="cat-tab" data-cat="religious">Religi</button>
  </div>

  <!-- CHANNEL LIST -->
  <div class="channel-section">
    <div class="channel-list" id="channel-list">
      <div style="display:flex;justify-content:center;padding:40px"><div class="spinner"></div></div>
    </div>
  </div>
</div>

    </a>
    <a href="/search.html" class="nav-item">

        <circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4" stroke-linecap="round"/>
      </svg><span>Cari</span>
    </a>
    <a href="/live.html" class="nav-item active">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="/assets/js/utils.js"></script>
<script>
(async function() {
  let allChannels = [], filterCat = '';
  let plyr = null, hls = null;

  // Load channels
  try {
    allChannels = await fetchJSON('/data/live/channels.json');
  } catch {
    document.getElementById('channel-list').innerHTML =
      '<div style="padding:32px 16px;text-align:center;color:var(--text-muted);font-size:13px">Data channel tidak tersedia.</div>';
    return;
  }

  // Category tabs
  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      filterCat = tab.dataset.cat;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t === tab));
      renderChannels();
    });
  });

  function renderChannels() {
    const list = filterCat ? allChannels.filter(c => c.category === filterCat) : allChannels;
    const el = document.getElementById('channel-list');
    if (!list.length) {
      el.innerHTML = '<div style="padding:32px 16px;text-align:center;color:var(--text-muted);font-size:13px">Tidak ada channel.</div>';
      return;
    }
    el.innerHTML = list.map(ch => `
      <div class="channel-item" data-id="${ch.id}">
        <img class="channel-logo" src="${ch.logo || '/assets/images/placeholder.svg'}" alt="${ch.name}" loading="lazy">
        <div class="channel-info">
          <div class="channel-name">${ch.name}</div>
          <div class="channel-now">${ch.now_playing || 'Live'}</div>
        </div>
        <div class="channel-live-badge">
          <span style="width:5px;height:5px;border-radius:50%;background:#ef4444;display:inline-block;animation:pulse-dot 1.5s infinite"></span>
          LIVE
        </div>
      </div>
    `).join('');

    el.querySelectorAll('.channel-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = item.dataset.id;
        const ch = allChannels.find(c => c.id === id);
        if (ch) playChannel(ch);
        el.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      });
    });
  }

  function playChannel(ch) {
    const videoWrap = document.getElementById('video-wrap');
    const nowPlaying = document.getElementById('now-playing');
    videoWrap.style.display = '';
    nowPlaying.style.display = '';
    document.getElementById('now-channel-name').textContent = ch.name;
    document.getElementById('now-program').textContent = ch.now_playing || 'Live';

    // Scroll to player
    videoWrap.scrollIntoView({ behavior: 'smooth' });

    // Destroy previous
    if (hls) { hls.destroy(); hls = null; }
    if (plyr) { plyr.destroy(); plyr = null; }

    const videoEl = document.getElementById('ryou-live-video');
    plyr = new Plyr(videoEl, {
      controls: ['play','progress','current-time','mute','volume','fullscreen'],
    });

    if (ch.url.includes('.m3u8') || ch.type === 'hls') {
      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(ch.url);
        hls.attachMedia(videoEl);
        hls.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play().catch(() => {}));
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        videoEl.src = ch.url;
        videoEl.play().catch(() => {});
      }
    } else {
      videoEl.src = ch.url;
      videoEl.play().catch(() => {});
    }
  }

  renderChannels();
})();
</script>
</body>
</html>
