<!DOCTYPE html>
<html lang="id" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <title>Favorit — Ryounime</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/nav.css">
  <link rel="stylesheet" href="assets/css/card.css">
  <style>
    .fav-page { padding: calc(var(--header-h) + 12px) 0 calc(var(--bottom-nav-h) + 16px); }
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
      border-bottom: 2px solid transparent;
      transition: all var(--transition);
      cursor: pointer;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .page-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      padding: 0 16px 12px;
      letter-spacing: -0.02em;
    }
    .history-list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: background var(--transition);
    }
    .history-item:active { background: var(--bg-card-hover); }
    .history-thumb {
      width: 56px; height: 56px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
      background: var(--bg-secondary);
    }
    .history-info { flex: 1; min-width: 0; }
    .history-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .history-meta { font-size: 11px; color: var(--text-muted); }
    .history-ep { font-size: 12px; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
    .empty-state { display: flex; flex-direction: column; align-items: center; padding: 60px 32px; text-align: center; gap: 12px; color: var(--text-muted); }
    .empty-state h3 { font-size: 15px; color: var(--text-secondary); }
    .empty-state p { font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo">
    <div class="header-logo-mark">Ry</div>
    <span class="header-logo-text">Ryou<span>nime</span></span>
  </div>
</header>

<div class="fav-page">
  <div class="page-title">Koleksi</div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="favorites">Favorit</button>
    <button class="tab-btn" data-tab="watchlist">Watchlist</button>
    <button class="tab-btn" data-tab="history">Riwayat</button>
  </div>

  <!-- FAVORITES -->
  <div class="tab-content active" id="tab-favorites">
    <div class="grid-cards" id="fav-grid"></div>
  </div>

  <!-- WATCHLIST -->
  <div class="tab-content" id="tab-watchlist">
    <div class="grid-cards" id="watchlist-grid"></div>
  </div>

  <!-- HISTORY -->
  <div class="tab-content" id="tab-history">
    <div class="history-list" id="history-list"></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div class="nav-items">
    <a href="index.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/>
      </svg><span>Home</span>
    </a>
    <a href="search.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4" stroke-linecap="round"/>
      </svg><span>Cari</span>
    </a>
    <a href="live.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/>
      </svg><span>Live</span>
    </a>
    <a href="favorites.html" class="nav-item active">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg><span>Favorit</span>
    </a>
    <a href="settings.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg><span>Setelan</span>
    </a>
  </div>
</nav>

<script src="assets/js/utils.js"></script>
<script>
function cardHtml(a) {
  return `
    <a href="details.html?id=${a.id}" class="card card-poster">
      <div class="card-thumb">
        <img data-src="${a.poster||'/assets/images/placeholder.svg'}" alt="${a.title}" src="assets/images/placeholder.svg">
        <div class="card-overlay"></div>
        ${a.type ? `<div class="card-badges"><span class="badge badge-accent">${a.type}</span></div>` : ''}
      </div>
      <div class="card-info">
        <div class="card-title line-clamp-2">${a.title}</div>
        <div class="card-meta">${a.year ? `<span>${a.year}</span>` : ''}</div>
      </div>
    </a>
  `;
}

function emptyState(msg) {
  return `<div class="empty-state" style="grid-column:1/-1"><h3>${msg}</h3><p>Belum ada yang tersimpan di sini.</p></div>`;
}

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
  });
});

// Favorites
const favs = Favorites.getAll();
const favGrid = document.getElementById('fav-grid');
favGrid.innerHTML = favs.length ? favs.map(cardHtml).join('') : emptyState('Belum ada favorit');
initLazyImages(favGrid);

// Watchlist
const wl = Watchlist.getAll();
const wlGrid = document.getElementById('watchlist-grid');
wlGrid.innerHTML = wl.length ? wl.map(cardHtml).join('') : emptyState('Watchlist kosong');
initLazyImages(wlGrid);

// History
const hist = History.getAll();
const histList = document.getElementById('history-list');
if (!hist.length) {
  histList.innerHTML = `<div class="empty-state"><h3>Belum ada riwayat</h3><p>Tontonanmu akan muncul di sini.</p></div>`;
} else {
  histList.innerHTML = hist.slice(0, 50).map(h => `
    <a href="watch.html?id=${h.animeId}&ep=${h.ep}" class="history-item">
      <img class="history-thumb" src="${h.poster||'/assets/images/placeholder.svg'}" alt="${h.animeTitle}" loading="lazy">
      <div class="history-info">
        <div class="history-ep">EP ${h.ep}</div>
        <div class="history-title line-clamp-1">${h.animeTitle}</div>
        <div class="history-meta">${timeAgo(h.ts)}</div>
      </div>
    </a>
  `).join('');
}
</script>
</body>
</html>
