<!DOCTYPE html>
<html lang="id" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 — Ryounime</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100dvh; }
    .error-wrap { text-align: center; padding: 32px; }
    .error-code {
      font-family: var(--font-display);
      font-size: 80px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 12px;
    }
    .error-msg { font-size: 16px; color: var(--text-secondary); margin-bottom: 24px; }
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 24px;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-lg);
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="error-wrap">
    <div class="error-code">404</div>
    <div class="error-msg">Halaman tidak ditemukan</div>
    <a href="/" class="home-btn">← Kembali ke Home</a>
  </div>
  <script src="/assets/js/utils.js"></script>
</body>
</html>
