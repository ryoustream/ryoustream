<!DOCTYPE html>
<html lang="id" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="description" content="Ryounime — Streaming anime, movie, series gratis. Mobile first.">
  <title>Ryounime</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/nav.css">
  <link rel="stylesheet" href="assets/css/hero.css">
  <link rel="stylesheet" href="assets/css/card.css">
</head>
<body>

<!-- HEADER -->
<header class="header" id="app-header">
  <div class="header-logo">
    <div class="header-logo-mark">Ry</div>
    <span class="header-logo-text">Ryou<span>nime</span></span>
  </div>
  <button class="header-search-btn" id="open-search" aria-label="Cari">
    <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4" stroke-linecap="round"/>
    </svg>
  </button>
</header>

<!-- SEARCH OVERLAY -->
<div class="search-overlay" id="search-overlay">
  <div class="search-bar">
    <div class="search-input-wrap">
      <svg class="search-input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4" stroke-linecap="round"/>
      </svg>
      <input type="search" class="search-input" id="search-input" placeholder="Cari anime, movie, series…" autocomplete="off">
    </div>
    <button class="search-cancel" id="close-search">Batal</button>
  </div>
  <div class="search-results" id="search-results">
    <div style="color:var(--text-muted);font-size:13px;text-align:center;margin-top:40px">Ketik untuk mencari…</div>
  </div>
</div>

<!-- MAIN -->
<main class="page" id="app-main">

  <!-- HERO BANNER -->
  <section class="hero" id="hero-section">
    <div class="hero-slides" id="hero-slides"></div>
    <div class="hero-dots" id="hero-dots"></div>
  </section>

  <!-- CONTINUE WATCHING -->
  <section class="section" id="continue-section" style="display:none">
    <div class="section-header">
      <span class="section-title">Lanjut Nonton</span>
      <a href="history.html" class="section-more">Lihat semua</a>
    </div>
    <div class="scroll-row" id="continue-row"></div>
  </section>

  <!-- TRENDING -->
  <section class="section">
    <div class="section-header">
      <span class="section-title">🔥 Trending</span>
      <a href="search.html?sort=trending" class="section-more">Lihat semua</a>
    </div>
    <div class="scroll-row" id="trending-row"></div>
  </section>

  <!-- LATEST UPDATE -->
  <section class="section">
    <div class="section-header">
      <span class="section-title">🆕 Update Terbaru</span>
      <a href="search.html?sort=latest" class="section-more">Lihat semua</a>
    </div>
    <div class="scroll-row" id="latest-row"></div>
  </section>

  <!-- POPULAR -->
  <section class="section">
    <div class="section-header">
      <span class="section-title">⭐ Populer</span>
      <a href="search.html?sort=popular" class="section-more">Lihat semua</a>
    </div>
    <div class="scroll-row" id="popular-row"></div>
  </section>

  <!-- NEW RELEASE -->
  <section class="section">
    <div class="section-header">
      <span class="section-title">🎬 Rilis Baru</span>
      <a href="search.html?sort=new" class="section-more">Lihat semua</a>
    </div>
    <div class="scroll-row" id="new-release-row"></div>
  </section>

</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <div class="nav-items">
    <a href="index.html" class="nav-item active">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      <span>Home</span>
    </a>
    <a href="search.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4" stroke-linecap="round"/>
      </svg>
      <span>Cari</span>
    </a>
    <a href="live.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/>
        <path d="M5.5 5.5a9 9 0 0 0 0 13M18.5 5.5a9 9 0 0 1 0 13" stroke-linecap="round"/>
      </svg>
      <span>Live</span>
    </a>
    <a href="favorites.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <span>Favorit</span>
    </a>
    <a href="settings.html" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Setelan</span>
    </a>
  </div>
</nav>

<!-- JS -->
<script src="assets/js/utils.js"></script>
<script src="assets/js/app.js"></script>
<script>
(async function() {
  // ===== HERO =====
  async function renderHero() {
    const slidesEl = document.getElementById('hero-slides');
    const dotsEl = document.getElementById('hero-dots');
    let banners = [];
    try { banners = await App.getHeroBanners(5); } catch {}
    if (!banners.length) { document.getElementById('hero-section').style.display = 'none'; return; }

    slidesEl.innerHTML = banners.map(a => `
      <div class="hero-slide">
        <div class="hero-bg">
          <img data-src="${a.banner}" alt="${a.title}" src="assets/images/placeholder.svg">
        </div>
        <div class="hero-content">
          <div class="hero-type-badge">${a.type || 'TV'}</div>
          <h1 class="hero-title line-clamp-2">${a.title}</h1>
          <div class="hero-meta">
            <span>${a.year || ''}</span>
            ${a.year ? '<span class="dot"></span>' : ''}
            <span>${a.status === 'ongoing' ? 'Ongoing' : a.status === 'completed' ? 'Completed' : ''}</span>
            ${a.rating ? `<span class="dot"></span><span>⭐ ${a.rating}</span>` : ''}
          </div>
          <div class="hero-actions">
            <a href="watch.html?id=${a.id}&ep=1" class="btn-watch">
              <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
              Tonton
            </a>
            <a href="details.html?id=${a.id}" class="btn-info">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="8"/><line x1="12" y1="12" x2="12" y2="16"/>
              </svg>
              Info
            </a>
          </div>
        </div>
      </div>
    `).join('');

    dotsEl.innerHTML = banners.map((_, i) =>
      `<div class="hero-dot ${i===0?'active':''}" data-i="${i}"></div>`
    ).join('');

    initLazyImages(slidesEl);

    // Auto-slide
    let cur = 0;
    function goTo(i) {
      cur = i;
      slidesEl.style.transform = `translateX(-${i*100}%)`;
      document.querySelectorAll('.hero-dot').forEach((d,j) => d.classList.toggle('active', j===i));
    }
    document.querySelectorAll('.hero-dot').forEach(d => d.addEventListener('click', () => goTo(Number(d.dataset.i))));
    const autoSlide = setInterval(() => goTo((cur+1) % banners.length), 5000);
    slidesEl.addEventListener('touchstart', () => clearInterval(autoSlide), { passive: true });
  }

  // ===== CARD =====
  function cardHtml(a) {
    const progress = ContinueWatching.getProgress(a.id);
    return `
      <a href="details.html?id=${a.id}" class="card card-poster">
        <div class="card-thumb">
          <img data-src="${a.poster || '/assets/images/placeholder.svg'}" alt="${a.title}" src="assets/images/placeholder.svg" loading="lazy">
          <div class="card-overlay"></div>
          <div class="card-badges">
            ${a.type ? `<span class="badge badge-accent">${a.type}</span>` : ''}
          </div>
          ${a.total_eps ? `<div class="card-ep-badge">${a.total_eps} ep</div>` : ''}
          <div class="card-play"><div class="card-play-icon"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div></div>
        </div>
        <div class="card-info">
          <div class="card-title line-clamp-2">${a.title}</div>
          <div class="card-meta">
            ${a.year ? `<span>${a.year}</span>` : ''}
            ${a.rating ? `<span class="card-meta-dot"></span><span class="score-badge"><svg viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>${a.rating}</span>` : ''}
          </div>
        </div>
        ${progress > 0 ? `<div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,0.1)"><div style="height:100%;width:${progress*100}%;background:var(--accent)"></div></div>` : ''}
      </a>
    `;
  }

  function wideCardHtml(item) {
    const progress = item.duration ? item.time / item.duration : 0;
    return `
      <a href="watch.html?id=${item.animeId}&ep=${item.ep}" class="card card-wide">
        <div class="card-thumb">
          <img data-src="${item.poster || '/assets/images/placeholder.svg'}" alt="${item.animeTitle}" src="assets/images/placeholder.svg" loading="lazy">
          <div class="card-overlay"></div>
          <div class="card-progress">
            <div class="card-progress-bar" style="width:${Math.min(progress*100,100)}%"></div>
          </div>
        </div>
        <div class="card-info">
          <div class="card-ep-label">EP ${item.ep}</div>
          <div class="card-title line-clamp-1">${item.animeTitle}</div>
        </div>
      </a>
    `;
  }

  function renderRow(rowId, items, type = 'poster') {
    const el = document.getElementById(rowId);
    if (!el) return;
    if (!items.length) { el.closest('.section')?.remove(); return; }
    el.innerHTML = items.map(type === 'wide' ? wideCardHtml : cardHtml).join('');
    initLazyImages(el);
  }

  // ===== SKELETONS =====
  ['trending-row','latest-row','popular-row','new-release-row'].forEach(id => {
    const el = document.getElementById(id);
    if (el) renderSkeletons(el, 8, 'poster');
  });

  // ===== LOAD DATA =====
  renderHero();

  // Continue watching
  const continueItems = ContinueWatching.getAll().slice(0,8);
  if (continueItems.length) {
    document.getElementById('continue-section').style.display = '';
    renderRow('continue-row', continueItems, 'wide');
  }

  try {
    const [trending, latest, popular, newRelease] = await Promise.all([
      App.getTrending(12),
      App.getLatestUpdate(12),
      App.getPopular(12),
      App.getNewRelease(12),
    ]);
    renderRow('trending-row', trending);
    renderRow('latest-row', latest);
    renderRow('popular-row', popular);
    renderRow('new-release-row', newRelease);
  } catch(e) {
    console.error('[Home] Error loading data:', e);
  }

  // ===== SEARCH =====
  const searchOverlay = document.getElementById('search-overlay');
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');

  document.getElementById('open-search').addEventListener('click', () => {
    searchOverlay.classList.add('open');
    setTimeout(() => searchInput.focus(), 100);
  });
  document.getElementById('close-search').addEventListener('click', () => {
    searchOverlay.classList.remove('open');
    searchInput.value = '';
  });

  searchInput.addEventListener('input', debounce(async () => {
    const q = searchInput.value.trim();
    if (!q) { searchResults.innerHTML = '<div style="color:var(--text-muted);font-size:13px;text-align:center;margin-top:40px">Ketik untuk mencari…</div>'; return; }
    searchResults.innerHTML = '<div style="display:flex;justify-content:center;padding:32px"><div class="spinner"></div></div>';
    const results = await App.search(q);
    if (!results.length) {
      searchResults.innerHTML = `<div style="color:var(--text-muted);font-size:13px;text-align:center;margin-top:40px">Tidak ditemukan: "${q}"</div>`;
      return;
    }
    searchResults.innerHTML = `<div class="grid-cards fade-in">${results.slice(0,24).map(cardHtml).join('')}</div>`;
    initLazyImages(searchResults);
  }, 350));

})();
</script>

<!-- Service Worker -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
